name: Kaggle Sandbox

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose sandbox action"
        required: true
        type: choice
        options:
          - SETUP_DATASETS
          - START
          - STOP

permissions:
  contents: read

concurrency:
  group: kaggle-sandbox-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          ACTION: ${{ inputs.action }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = "SETUP_DATASETS" ] || [ "$ACTION" = "START" ]; then
            test -n "$KAGGLE_USERNAME" || { echo "Missing Actions Secret KAGGLE_USERNAME"; exit 1; }
            test -n "$KAGGLE_KEY" || { echo "Missing Actions Secret KAGGLE_KEY"; exit 1; }
          fi
          if [ "$ACTION" = "START" ] || [ "$ACTION" = "STOP" ]; then
            test -n "$NTFY_TOPIC" || { echo "Missing Actions Secret NTFY_TOPIC"; exit 1; }
          fi

      - name: Configure Kaggle credentials
        if: ${{ inputs.action != 'STOP' }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kaggle"
          python - <<'PY'
          import json, os
          path = os.path.expanduser("~/.kaggle/kaggle.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump({"username": os.environ["KAGGLE_USERNAME"],
                         "key": os.environ["KAGGLE_KEY"]}, f)
          os.chmod(path, 0o600)
          PY
          python -m pip install --quiet --upgrade kaggle

      - name: Create or update the three private Datasets
        if: ${{ inputs.action == 'SETUP_DATASETS' }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dataset() {
            local folder="$1"
            local dataset_id="$2"
            local note="$3"
            local output=""
            local status_output=""
            echo "Publishing $dataset_id from $folder"
            if status_output="$(kaggle datasets status "$dataset_id" 2>&1)"; then
              echo "$dataset_id already exists; publishing a new version."
              if ! output="$(kaggle datasets version -p "$folder" -m "$note" -q -t -r zip 2>&1)"; then
                printf '%s\n' "$output"
                return 1
              fi
            else
              echo "STATUS CHECK FAILED for $dataset_id:"
              printf '%s\n' "$status_output"
              echo "No accessible Dataset found by status. Creating with a unique title for this GitHub Actions run."
              if [ "$dataset_id" = "maithanhtu/sandbox-runtime" ]; then
                python - "$folder/dataset-metadata.json" "$GITHUB_RUN_ID" <<'PY'
          import json, sys
          path, run_id = sys.argv[1], sys.argv[2]
          with open(path, "r", encoding="utf-8") as f:
              metadata = json.load(f)
          metadata["title"] = f"Hermes Runtime Bundle {run_id}"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(metadata, f, ensure_ascii=False, indent=2)
              f.write("\n")
          print(f"Runtime Dataset title for this run: {metadata['title']}")
          PY
              fi
              if ! output="$(kaggle datasets create -p "$folder" -r zip 2>&1)"; then
                printf '%s\n' "$output"
                echo "Dataset creation failed for $dataset_id. Check the Kaggle error above; do not retry with random titles."
                return 1
              fi
            fi
            printf '%s\n' "$output"
            if printf '%s' "$output" | grep -Eiq 'Dataset creation error|Dataset version creation error|Client Error|Traceback'; then
              echo "Kaggle reported an error while publishing $dataset_id."
              return 1
            fi
            echo "Kaggle accepted the publish request for $dataset_id."
          }
          publish_dataset datasets/package-cache maithanhtu/sandbox-package-cache "Initialize private package cache"
          publish_dataset datasets/secret-store maithanhtu/sandbox-secret-store "Initialize private secret store seed"
          publish_dataset datasets/runtime maithanhtu/sandbox-runtime "Initialize private Hermes runtime seed"
          echo "All three Dataset publish requests were accepted."

      - name: Send cooperative STOP signal
        if: ${{ inputs.action == 'STOP' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H "Content-Type: text/plain" \
            --data-binary "STOP" \
            "https://ntfy.sh/${NTFY_TOPIC}"
          echo "STOP signal published. Kaggle will exit when its polling loop receives it."

      - name: Verify all Dataset attachments exist
        if: ${{ inputs.action == 'START' }}
        shell: bash
        run: |
          set -euo pipefail
          kaggle datasets status maithanhtu/sandbox-package-cache
          kaggle datasets status maithanhtu/sandbox-secret-store
          kaggle datasets status maithanhtu/sandbox-runtime

      - name: Push and start Kaggle kernel
        if: ${{ inputs.action == 'START' }}
        run: |
          set -euo pipefail
          kaggle kernels push -p kernel --timeout 43200
